# Note: NVIDIA Container Toolkit must be installed on the host.
# Note: Docker daemon must be configured to use the nvidia runtime
# Note: For rootless, we now use deploy.resources.reservations.devices (replicates --gpus all)
services:
  # The LLM Engine
  llm-ollama:
    image: ollama/ollama
    container_name: llm-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_FLASH_ATTENTION=${FLASH_ATTENTION:-0}
      - OLLAMA_KEEP_ALIVE=${KEEP_ALIVE:-10m}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES_OLLAMA:-all}
      # llama.cpp prompt-state cache budget (MiB). Ollama forwards LLAMA_ARG_*
      # straight to its llama-server child, overriding llama.cpp's 8192 MiB
      # default. Larger = fewer full re-prefills when an aux call claims the slot.
      - LLAMA_ARG_CACHE_RAM=${CACHE_RAM:-8192}
      # Full-size SWA KV cache. Costs more ram, but without this, SWA/hybrid models invalidate
      # context checkpoints as the window advances and force full prompt
      # reprocessing on reuse. No-op on non-SWA models.
      - LLAMA_ARG_SWA_FULL=${SWA_FULL:-0}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: # Reachable on port 11434
      - llm-network

  # A whisper server for local, private, speech-to-text support
  # This one is a self-built container using whisper.cpp. A custom entrypoint script provides the OpenAPI compatible REST interface.
  # It has some advantages over hwdsl/whisper-server, including the cancellation of requests
  llm-whisper:
    image: llm-whisper:nvidia
    pull_policy: build
    container_name: llm-whisper
    build:
      context: ./whisper
      dockerfile: Dockerfile.nvidia
      args:
        BACKEND: nvidia
        # Optional: override CUDA architectures (default from Dockerfile is '75;80;86;90')
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-75;80;86;90}
    environment:
      - MODEL_SIZE=small
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES_WHISPER:-all}
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - whisper-data:/app/models
      - whisper-data:/root/.wespeaker
    restart: unless-stopped
    networks:
      - llm-network

volumes:
  ollama-data:
  whisper-data:

networks:
  llm-network:
