name: llm

# Preliminary setups:
# - Make sure your graphic cards drivers are installed
# - Ensure your root, or wherever docker saves its image and volume data, has enough space
#
# AMD USERS:
#   Just run docker compose up and you are good to go :)
# NVIDIA USERS:
#   You need to setup the nvidia container toolkit before you begin, then restart your docker service.
#   That way, the containers are able to access the GPU through the additional deploy option

services:
  # The LLM Engine-ollama: Not included here, as the GPU/CPU backends are specific to your system. You should include the appropriate additional .yaml file depending on your system
  # with -f <choice>.yaml (e.g. cpu.yaml, amd-gpu.yaml) in your docker compose call
  # This also includes other gpu-dependent containers, like the whisper container

  # The User Interface
  llm-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: llm-webui
    depends_on:
      - llm-ollama
      - llm-reranker
      - llm-whisper
      - llm-kokoro
      - llm-setup
    restart: unless-stopped
    environment:
      #- GLOBAL_LOG_LEVEL=DEBUG

      # Do not use hugging face, which likes to cause problems. Don't do external connections in general
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      - RAG_RERANKING_MODEL_AUTO_UPDATE=false
      - WHISPER_MODEL_AUTO_UPDATE=false

      # Connection to Ollama (using Docker service name)
      - OLLAMA_BASE_URL=http://llm-ollama:11434

      # Use Ollama-based models for embedding and task (titles, tags, ...)generation
      # This also prevents any initial hugging face downloads, which tend to fail :)
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=mxbai-embed-large
      - TASK_MODEL=qwen2.5:3b

      # Use local container for reranking tasks
      - RAG_RERANKING_ENGINE=external
      - RAG_RERANKING_MODEL=local-reranker
      - ENABLE_RAG_HYBRID_SEARCH=true
      - RERANKING_URL=http://llm-reranker:8000/rerank

      # Text to Speech and Speech to Text Settings
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://llm-whisper:9091/v1
      - AUDIO_STT_OPENAI_API_KEY=not-needed

      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://llm-kokoro:8880/v1
      - AUDIO_TTS_OPENAI_API_KEY=not-needed
      - AUDIO_TTS_MODEL=kokoro
      - AUDIO_TTS_VOICE=am_michael

      # Authentication – disabled by default
      - WEBUI_AUTH=${WEBUI_AUTH:-False}
      - ENABLE_LOGIN_FORM=${WEBUI_AUTH:-False}
      - ENABLE_SIGNUP=${WEBUI_AUTH:-False}  # Needs to be set to true if you want auth so you can create your admin account - is automatically disabled right after

      # CORS Security: If this is set to *, a user visiting a malicious website can let it steal data from
      # the service. Thus this enumerates the hosts under which your service is known / reachable.
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-*}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}

      # Telemetry off
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false

      # Feature Settings
      - ENABLE_FOLLOW_UP_GENERATION=false

      # Default model settings
      - DEFAULT_CONTEXT_LENGTH=32768 # Default of 2048 is laughably small and quickly causes issues

      # Tools REST Endpoint server for implementing tools in webui without installing software
      # within the webui container
      - TOOL_SERVER_URL=http://llm-tools:8000
    volumes:
      - open-webui-data:/app/backend/data
    networks: # Reachable on port 8080
      - llm-network
    #ports: # Publish openly on port 3000 on this computer by default
    #  - "${OPEN_WEBUI_BIND:-0.0.0.0:3000}:8080"

  # Setup container for initial setup - pulling ollama models and configuring webui
  llm-setup:
    build: ./setup
    pull_policy: build
    image: llm-setup
    container_name: llm-setup
    environment:
      - SETUP_TYPE=${SETUP_TYPE:-desktop}
      - OLLAMA_URL=http://llm-ollama:11434
      - SKIP_DB_COPY=${SKIP_DB_COPY:-false}
    volumes:
      - open-webui-data:/open-webui-data
    depends_on:
      - llm-ollama
    restart: "no"
    networks:
      - llm-network

  # The reranking model
  # Custom-built container that starts a small webserver, accepting reranker requests at /rerank
  # and calling an efficient cross-encoder reranking model to serve them
  # This proved to work much better than the alternatives:
  #  - OpenWebUI Built-Ins: Requires Hugging Face connection and GPU setup to download models; causes startup issues
  #  - Tei-Reranker container: Does a lot of "warmup" on startup, presumably to later serve requests
  #      faster. However, this makes multiple minutes of 100% CPU load. Ironically, my
  #      custom-built container has lower latency even without any of the warmup nonsense
  #  - Ollama-based wrapper: You can also pull a reranker into ollama and try to build a wrapper
  #      container that provides the /rerank endpoint. But then you have to work in an unoptimized, text-based
  #      manner, the container is more complicated, and it frankly just wasn't practical (repeated ollama
  #      startups took several seconds for each part of the query; not okay)
  # This option starts practically instantly (after model is downloaded) and has the lowest request
  # latency of them all (for a small example payload)
  llm-reranker:
    image: llm-reranker
    container_name: llm-reranker
    build: ./reranker
    pull_policy: build
    restart: unless-stopped
    environment:
      #- RERANK_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2 # Super lightweight
      - RERANK_MODEL=BAAI/bge-reranker-v2-m3 # High accuracy
      - PRIVACY_MODE=true
      - LOG_LEVEL=DEBUG
      - LOG_PREVIEW_LEN=999999
    volumes:
      - reranker-cache:/root/.cache
    networks: # Reachable on port 8000
      - llm-network

  # A reverse-proxy for HTTPs support (may help browsers not freak out over certain APIs, like geolocation)
  llm-caddy:
    image: caddy:alpine
    container_name: llm-caddy
    restart: unless-stopped
    # Ports are published through a separately generated caddy compose file
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/server.crt:/etc/caddy/server.crt
      - ./caddy/server.key:/etc/caddy/server.key
      - caddy-data:/data
    networks:
      - llm-network

  # Text to speech server
  llm-kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: llm-kokoro
    restart: unless-stopped
    environment:
      - KOKORO_LOCAL_ONLY=true # Enable offline-only mode after the initial model download
      - KOKORO_DEFAULT_VOICE=am_michael
    volumes:
      - tts-cache:/root/.cache
    ports:
      - "127.0.0.1:8880:8880"
    networks: # Reachable at 8880
      - llm-network

  # A tools server, hosting custom scripts and software to be used by configured LLM skills / tools.
  llm-tools:
    image: llm-tools
    container_name: llm-tools
    build: ./tools
    pull_policy: build
    restart: unless-stopped
    networks: # REST API reachable on port 8000
      - llm-network

  # TODO: The memory / recall management
  # TODO: The search and cache engine

volumes:
  tts-cache:
    name: tts-cache
  reranker-cache:
    name: reranker-cache
  whisper-data:
    name: whisper-data
  caddy-data:
    name: caddy-data
  ollama-data:
    name: ollama-data
  open-webui-data:
    name: open-webui-data

networks:
  llm-network:
    name: llm-network
    driver: bridge
