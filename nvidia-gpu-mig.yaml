# Override for MIG: replaces deploy.resources.reservations.devices with device_ids for both services
services:
  llm-ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_VISIBLE_DEVICES_OLLAMA}"]
              capabilities: [gpu]
  llm-whisper:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_VISIBLE_DEVICES_WHISPER}"]
              capabilities: [gpu]
