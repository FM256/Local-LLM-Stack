services:
  # The LLM Engine
  llm-ollama:
    image: ollama/ollama
    container_name: llm-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=32768   # Context length for when you run ollama from the terminal (webui will override it). Default of 4096 is relatively small
      - OLLAMA_FLASH_ATTENTION=${FLASH_ATTENTION:-0}   # No-op on CPU; kept for config consistency
      - OLLAMA_KEEP_ALIVE=${KEEP_ALIVE:-10m}
      # llama.cpp prompt-state cache budget (MiB). Ollama forwards LLAMA_ARG_*
      # straight to its llama-server child, overriding llama.cpp's 8192 MiB
      # default. Larger = fewer full re-prefills when an aux call claims the slot.
      - LLAMA_ARG_CACHE_RAM=${CACHE_RAM:-8192}
      # Full-size SWA KV cache. Costs more ram, but without this, SWA/hybrid models invalidate
      # context checkpoints as the window advances and force full prompt
      # reprocessing on reuse. No-op on non-SWA models.
      - LLAMA_ARG_SWA_FULL=${SWA_FULL:-0}
    networks: # Reachable on port 11434
      - llm-network

  # A whisper server for local, private, speech-to-text support
  # This one is a self-built container using the whisper.cpp. A custom entrypoint script provides the OpenAPI compatible REST interface.
  # It has some advantages over hwdsl/whisper-server, including the cancelation of requests
  llm-whisper:
    image: llm-whisper:cpu
    pull_policy: build
    build:
      context: ./whisper
      dockerfile: Dockerfile.cpu
    container_name: llm-whisper
    environment:
      MODEL_SIZE: small
      WHISPER_THREADS: 8
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - whisper-data:/app/models
      - whisper-data:/root/.wespeaker
    restart: unless-stopped
    networks:
      - llm-network
